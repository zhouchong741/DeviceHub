appId: com.droidwall.app
productName: DroidWall
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  - "!resources/**"
extraResources:
  - from: resources/scrcpy-server.jar
    to: scrcpy-server.jar
mac:
  category: public.app-category.developer-tools
  extendInfo:
    NSLocalNetworkUsageDescription: "DroidWall 需要访问本地网络以发现并连接同一 Wi-Fi 下的 Android 无线调试设备。"
  target:
    - target: dmg
      arch:
        - arm64
    - target: dir
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
