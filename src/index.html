<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:* ws://localhost:* http://localhost:*; img-src 'self' data: blob:;"
  />
  <meta name="color-scheme" content="light dark" />
  <script>
    try {
      const saved = localStorage.getItem('droidwall-color-scheme');
      document.querySelector('meta[name="color-scheme"]').content =
        saved === 'light' || saved === 'dark' ? saved : 'light dark';
    } catch {}
  </script>
  <title>DroidWall</title>
</head>
<body class="h-screen w-screen overflow-hidden antialiased select-none">
  <div id="root" class="h-full w-full"></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
