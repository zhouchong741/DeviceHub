<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <script>
    try {
      const savedScheme = localStorage.getItem('droidwall-demo-scheme');
      document.querySelector('meta[name="color-scheme"]').content =
        savedScheme === 'light' || savedScheme === 'dark' ? savedScheme : 'light dark';
    } catch {}
  </script>
  <title>DroidWall — Antigravity 风格 UI Demo</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;

      /* 舞台外框背景：用于展示独立桌面应用窗口效果 */
      --stage-bg: light-dark(#dfe4ec, #07080c);

      /* Antigravity 核心色系：统一外壳底色 + 独立圆角内容画布 */
      --shell-bg: light-dark(#eceff4, #16181e);
      --canvas-surface: light-dark(#ffffff, #0f1116);
      --canvas-border: light-dark(rgba(15, 23, 42, 0.085), rgba(255, 255, 255, 0.085));
      --shell-divider: light-dark(rgba(15, 23, 42, 0.07), rgba(255, 255, 255, 0.07));

      /* 强调色与状态点 */
      --accent-blue: light-dark(#007aff, #0a84ff);
      --accent-blue-soft: light-dark(rgba(0, 122, 255, 0.12), rgba(10, 132, 255, 0.22));
      --accent-green: light-dark(#248a3d, #30d158);
      --accent-amber: light-dark(#b25000, #ff9f0a);

      /* 文本层级 */
      --text-primary: light-dark(rgba(15, 23, 42, 0.90), rgba(255, 255, 255, 0.92));
      --text-secondary: light-dark(rgba(15, 23, 42, 0.62), rgba(235, 235, 245, 0.62));
      --text-tertiary: light-dark(rgba(15, 23, 42, 0.42), rgba(235, 235, 245, 0.38));

      /* 侧栏与顶栏控件表面 */
      --action-pill-bg: light-dark(rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.06));
      --action-pill-border: light-dark(rgba(15, 23, 42, 0.09), rgba(255, 255, 255, 0.10));
      --tint-hover: light-dark(rgba(15, 23, 42, 0.055), rgba(255, 255, 255, 0.08));
      --tint-active: light-dark(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.11));

      /* 设备硬件卡片 */
      --device-shell: light-dark(#f8fafc, #181b22);
      --device-shell-border: light-dark(rgba(15, 23, 42, 0.095), rgba(255, 255, 255, 0.095));
      --device-bar-bg: light-dark(#f8fafc, #181b22);
      --device-well: light-dark(#edf1f6, #07090d);

      /* 滚动条令牌 */
      --sb-thumb: light-dark(rgba(60, 60, 67, 0.34), rgba(235, 235, 245, 0.32));
      --sb-track: transparent;
    }

    :root:has(> head > meta[name="color-scheme"][content="dark"]) {
      color-scheme: dark;
    }
    :root:has(> head > meta[name="color-scheme"][content="light"]) {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--text-primary);
      background: var(--stage-bg);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .mono-num {
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* macOS 窗口框（外圆角 16px，统一 --shell-bg 底色） */
    .app-window {
      border-radius: 16px;
      background: var(--shell-bg);
      border: 1px solid var(--canvas-border);
      box-shadow:
        0 26px 70px -18px rgba(0, 0, 0, 0.28),
        0 4px 16px -4px rgba(0, 0, 0, 0.12);
    }

    /* Antigravity 风格原生交通灯：12px 圆点，间距 8px */
    .traffic-dot {
      width: 12px;
      height: 12px;
      border-radius: 9999px;
      border: 0.5px solid rgba(0, 0, 0, 0.16);
      display: inline-block;
      flex-shrink: 0;
    }

    /* Antigravity "+ New Conversation" 同款全宽细边框主操作按钮 */
    .sidebar-primary-btn {
      background: var(--action-pill-bg);
      border: 1px solid var(--action-pill-border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    /* 右侧独立圆角内容画布 */
    .content-canvas {
      border-radius: 14px;
      background: var(--canvas-surface);
      border: 1px solid var(--canvas-border);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
    }

    /* 顶栏按钮：统一最小交互热区与 ARIA 选中态 */
    .tb-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-inline-size: 26px;
      min-block-size: 26px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .tb-btn-icon {
      padding: 0 6px;
    }

    .tb-btn:focus-visible,
    .nav-btn:focus-visible,
    .sidebar-row:focus-visible,
    .sidebar-primary-btn:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    .tb-btn[aria-pressed="true"] {
      background: var(--tint-active);
      color: var(--accent-blue);
      border-color: var(--action-pill-border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .tb-btn[aria-disabled="true"],
    .nav-btn[aria-disabled="true"] {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .tb-sep {
      display: inline-block;
      width: 1px;
      height: 14px;
      margin: 0 4px;
      background: var(--shell-divider);
      flex-shrink: 0;
    }

    @media (hover: hover) {
      .tb-btn:not([aria-disabled="true"]):hover,
      .nav-btn:not([aria-disabled="true"]):hover,
      .sidebar-row:hover {
        background: var(--tint-hover);
        color: var(--text-primary);
      }
      .sidebar-primary-btn:hover {
        border-color: light-dark(rgba(15, 23, 42, 0.16), rgba(255, 255, 255, 0.18));
        background: light-dark(#ffffff, rgba(255, 255, 255, 0.09));
      }
      .device-card:hover {
        border-color: light-dark(rgba(0, 122, 255, 0.28), rgba(10, 132, 255, 0.34));
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .tb-btn,
      .nav-btn,
      .sidebar-row,
      .sidebar-primary-btn,
      .device-card {
        transition:
          background-color 150ms ease,
          border-color 150ms ease,
          color 150ms ease,
          box-shadow 160ms ease;
      }
      .floating-toast {
        transition:
          opacity 180ms ease,
          transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
    }

    /* 瞬时弹出自动隐藏 Toast（平时完全不可见，不占布局空间） */
    .floating-toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translate(-50%, -8px);
      opacity: 0;
      pointer-events: none;
      background: light-dark(rgba(255, 255, 255, 0.92), rgba(32, 36, 44, 0.92));
      border: 1px solid var(--action-pill-border);
      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
    }

    .floating-toast[data-open="true"] {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    /* 设备卡同心几何：外框 20px -> pad 6px -> 屏幕 14px */
    .device-card {
      border-radius: 20px;
      background: var(--device-shell);
      border: 1px solid var(--device-shell-border);
      box-shadow: 0 4px 18px -6px rgba(0, 0, 0, 0.10);
    }

    .device-screen-canvas {
      border-radius: 14px;
    }

    /* 标准滚动条 + 非支持浏览器隔离回退 */
    .glass-scroller {
      scrollbar-width: thin;
      scrollbar-color: var(--sb-thumb) var(--sb-track);
    }

    @supports not (scrollbar-color: auto) {
      .glass-scroller {
        scrollbar-width: auto;
      }
      .glass-scroller::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .glass-scroller::-webkit-scrollbar-thumb {
        background: var(--sb-thumb);
        border-radius: 9999px;
      }
      .glass-scroller::-webkit-scrollbar-track {
        background: var(--sb-track);
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-3 sm:p-5 overflow-hidden">

  <!-- 模拟 macOS 桌面应用窗口 -->
  <div class="app-window w-full max-w-[1440px] h-[calc(100vh-24px)] sm:h-[calc(100vh-40px)] min-h-[640px] flex flex-col overflow-hidden">

    <!-- 1. 统一融合顶栏（高度 40px，与左侧边栏完全同底色，消除左上角割裂） -->
    <header class="h-[40px] shrink-0 flex items-center justify-between px-3.5 relative">
      <!-- 左侧：紧致红黄绿按钮（13px inset） + 固定侧栏切换按钮 + 简洁标题 -->
      <div class="flex items-center">
        <div class="flex items-center gap-[8px]" aria-hidden="true">
          <span class="traffic-dot bg-[#ff5f57]"></span>
          <span class="traffic-dot bg-[#febc2e]"></span>
          <span class="traffic-dot bg-[#28c840]"></span>
        </div>

        <div class="ml-4 flex items-center gap-1">
          <button type="button"
                  id="btn-toggle-sidebar"
                  onclick="toggleSidebar()"
                  aria-pressed="false"
                  aria-label="收起或展开侧边栏"
                  title="切换侧边栏"
                  class="tb-btn tb-btn-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="3"></rect>
              <path d="M9 4v16"></path>
            </svg>
          </button>
          <span class="text-[12.5px] font-medium text-[var(--text-secondary)] tracking-tight pl-1">DroidWall</span>
        </div>
      </div>

      <!-- 右侧：轻量紧凑控制工具栏 -->
      <div role="toolbar"
           focusgroup="toolbar wrap"
           aria-label="DroidWall 控制栏"
           class="flex items-center gap-0.5">
        <div role="group" aria-label="投屏画质" class="flex items-center gap-0.5">
          <button type="button" id="q-540" aria-pressed="false" onclick="setQuality('540p')" class="tb-btn mono-num">540p</button>
          <button type="button" id="q-720" aria-pressed="false" onclick="setQuality('720p')" class="tb-btn mono-num">720p</button>
          <button type="button" id="q-1080" aria-pressed="true" onclick="setQuality('1080p')" class="tb-btn mono-num">1080p</button>
        </div>

        <span role="separator" aria-orientation="vertical" class="tb-sep"></span>

        <div role="group" aria-label="网格列数" class="flex items-center gap-0.5">
          <button type="button" id="col-2" aria-pressed="false" onclick="setGridCols(2)" class="tb-btn mono-num">2列</button>
          <button type="button" id="col-3" aria-pressed="true" onclick="setGridCols(3)" class="tb-btn mono-num">3列</button>
          <button type="button" id="col-4" aria-pressed="false" onclick="setGridCols(4)" class="tb-btn mono-num">4列</button>
        </div>

        <span role="separator" aria-orientation="vertical" class="tb-sep"></span>

        <button type="button"
                id="btn-extra-devices"
                aria-pressed="false"
                onclick="toggleExtraDevices()"
                title="切换展示 2 台实机或 4 台多机混排"
                class="tb-btn">
          <span>4机演示</span>
        </button>

        <span role="separator" aria-orientation="vertical" class="tb-sep"></span>

        <button type="button"
                id="btn-theme-toggle"
                onclick="toggleColorScheme()"
                aria-label="切换浅色或深色外观"
                title="切换浅色 / 深色外观"
                class="tb-btn tb-btn-icon">
          <svg id="theme-icon-sun" width="14.5" height="14.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg id="theme-icon-moon" width="14.5" height="14.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="hidden" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 2. 主体工作区：无框融合左侧栏 + 右侧大圆角独立内容画布 -->
    <div class="flex-1 flex min-h-0 overflow-hidden">

      <!-- 融合左侧边栏（无独立白盒、与顶栏共享 --shell-bg） -->
      <aside id="shell-sidebar"
             aria-label="设备侧边栏"
             class="w-[236px] shrink-0 flex flex-col justify-between px-2.5 pt-1 pb-2.5 overflow-hidden">

        <div class="flex flex-col flex-1 min-h-0">
          <!-- Antigravity "+ New Conversation" 同款全宽圆角细边框主按钮 -->
          <button type="button"
                  onclick="toggleAllMirrors()"
                  class="sidebar-primary-btn w-full px-3 py-2 rounded-[10px] flex items-center gap-2 text-[13px] font-medium text-[var(--text-primary)] cursor-pointer shrink-0">
            <svg id="icon-all-pause" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="6" y="5" width="4" height="14" rx="1"></rect>
              <rect x="14" y="5" width="4" height="14" rx="1"></rect>
            </svg>
            <svg id="icon-all-play" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hidden" aria-hidden="true">
              <polygon points="6 4 20 12 6 20 6 4"></polygon>
            </svg>
            <span id="label-all-mirror">暂停全部投屏</span>
          </button>

          <!-- 设备列表 -->
          <div class="mt-3.5 px-1.5 flex items-center justify-between shrink-0">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-[var(--text-tertiary)]">
              USB 真机 (<span id="device-count" class="mono-num">2</span>)
            </span>
          </div>

          <div id="sidebar-devices" class="mt-1.5 flex-1 overflow-y-auto glass-scroller space-y-0.5 pr-0.5"></div>
        </div>

        <!-- 底部轻盈扁平 ADB 状态行（无重框盒子） -->
        <div class="pt-2 mt-2 border-t border-[var(--shell-divider)] px-1.5 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-2 h-2 rounded-full bg-[var(--accent-green)] shrink-0"></span>
            <div class="min-w-0">
              <div class="text-[11.5px] font-medium truncate text-[var(--text-primary)]">Android SDK ADB</div>
              <div class="mono-num text-[10px] truncate text-[var(--text-tertiary)]">v37.0.0 · 5037</div>
            </div>
          </div>

          <div class="flex items-center gap-0.5 shrink-0">
            <button type="button"
                    onclick="showToast('已定位本机 ~/Library/Android/sdk/platform-tools/adb', { tone: 'info' })"
                    title="选择 ADB 路径"
                    aria-label="选择 ADB 路径"
                    class="nav-btn w-6 h-6 rounded-md flex items-center justify-center text-[var(--text-secondary)] cursor-pointer">
              <svg width="13.5" height="13.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
            </button>
            <button type="button"
                    onclick="showToast('ADB 服务正常 · 127.0.0.1:5037 (v37.0.0)', { tone: 'success' })"
                    title="刷新 ADB 状态"
                    aria-label="刷新 ADB 状态"
                    class="nav-btn w-6 h-6 rounded-md flex items-center justify-center text-[var(--text-secondary)] cursor-pointer">
              <svg width="13.5" height="13.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                <polyline points="21 3 21 9 15 9"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <!-- 右侧独立大圆角内容画布（与 Antigravity 右侧主面板一致，仅在截图等事件时瞬时弹出 Toast） -->
      <main id="main-canvas" class="content-canvas relative flex-1 flex flex-col min-w-0 overflow-hidden mb-2 mr-2">
        <!-- 瞬时自动隐藏 Toast -->
        <div id="floating-toast"
             data-open="false"
             role="status"
             aria-live="polite"
             onmouseenter="pauseToastTimer()"
             onmouseleave="resumeToastTimer()"
             class="floating-toast z-30 rounded-full px-3.5 py-1.5 flex items-center gap-2.5 max-w-[90%] text-[12px]">
          <span id="toast-icon" class="shrink-0 flex items-center"></span>
          <span id="toast-text" class="text-[var(--text-primary)] truncate"></span>
          <button type="button"
                  id="toast-action"
                  onclick="onToastAction()"
                  class="hidden shrink-0 text-[11.5px] font-medium text-[var(--accent-blue)] hover:underline cursor-pointer">
            在 Finder 中显示
          </button>
        </div>

        <section aria-label="真机多屏墙" class="flex-1 overflow-y-auto glass-scroller p-4">
          <div id="device-grid" class="grid grid-flow-dense gap-4 items-start"></div>
        </section>
        <p id="a11y-status" role="status" class="sr-only"></p>
      </main>

    </div>
  </div>

  <script>
    const baseDevices = [
      {
        serial: '559a108a',
        name: 'Xiaomi Pad 6',
        os: 'Android 14',
        width: 1080,
        height: 674,
        status: 'mirroring',
        fps: 30,
        page: 0,
        screenOff: false,
        flash: false,
        ripples: []
      },
      {
        serial: '8XL7JZFY8L4XAIBU',
        name: 'Redmi K70 Ultra',
        os: 'Android 16',
        width: 484,
        height: 1080,
        status: 'mirroring',
        fps: 30,
        page: 0,
        screenOff: false,
        flash: false,
        ripples: []
      }
    ];

    const extraDevices = [
      {
        serial: '38041FDH20049X',
        name: 'Pixel 9 Pro',
        os: 'Android 15',
        width: 480,
        height: 1070,
        status: 'mirroring',
        fps: 30,
        page: 0,
        screenOff: false,
        flash: false,
        ripples: []
      },
      {
        serial: 'OP13993A8B',
        name: 'OnePlus 13',
        os: 'Android 15',
        width: 488,
        height: 1074,
        status: 'ready',
        fps: 0,
        page: 0,
        screenOff: false,
        flash: false,
        ripples: []
      }
    ];

    let showExtra = false;
    let sidebarCollapsed = false;
    let gridCols = 3;
    let focusedSerial = null;
    let currentQuality = '1080p';
    let isPointerDown = false;
    let activeSerial = null;
    let lastTrailTime = 0;

    function getActiveDevices() {
      return showExtra ? [...baseDevices, ...extraDevices] : baseDevices;
    }

    function getResolvedScheme() {
      const content = document.querySelector('meta[name="color-scheme"]')?.content || 'light dark';
      if (content === 'dark') return 'dark';
      if (content === 'light') return 'light';
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function updateThemeToggleIcon() {
      const isDark = getResolvedScheme() === 'dark';
      document.getElementById('theme-icon-sun').classList.toggle('hidden', !isDark);
      document.getElementById('theme-icon-moon').classList.toggle('hidden', isDark);
    }

    function toggleColorScheme() {
      const current = getResolvedScheme();
      const target = current === 'dark' ? 'light' : 'dark';
      const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const meta = document.querySelector('meta[name="color-scheme"]');

      if (target === sys) {
        try { localStorage.removeItem('droidwall-demo-scheme'); } catch {}
        meta.content = 'light dark';
      } else {
        try { localStorage.setItem('droidwall-demo-scheme', target); } catch {}
        meta.content = target;
      }
      updateThemeToggleIcon();
      drawAllCanvases();
      announce(target === 'dark' ? '已切换至深色外观' : '已切换至浅色外观');
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'droidwall-demo-scheme') {
        const meta = document.querySelector('meta[name="color-scheme"]');
        meta.content = e.newValue === 'light' || e.newValue === 'dark' ? e.newValue : 'light dark';
        updateThemeToggleIcon();
        drawAllCanvases();
      }
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      updateThemeToggleIcon();
      drawAllCanvases();
    });

    let toastTimer = null;
    let lastToastActionMsg = '';

    function announce(msg) {
      const live = document.getElementById('a11y-status');
      if (live) live.textContent = msg;
    }

    function hideToast() {
      const el = document.getElementById('floating-toast');
      if (el) el.setAttribute('data-open', 'false');
    }

    function scheduleToastHide(delayMs = 2800) {
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastTimer = null;
        hideToast();
      }, delayMs);
    }

    function pauseToastTimer() {
      if (toastTimer) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }
    }

    function resumeToastTimer() {
      const el = document.getElementById('floating-toast');
      if (el && el.getAttribute('data-open') === 'true') {
        scheduleToastHide(1400);
      }
    }

    function onToastAction() {
      hideToast();
      showToast(`已在 Finder 中定位：${lastToastActionMsg}`, { tone: 'info' });
    }

    function showToast(message, options = {}) {
      const { tone = 'success', actionLabel = '', actionTarget = '' } = options;
      const el = document.getElementById('floating-toast');
      const iconEl = document.getElementById('toast-icon');
      const textEl = document.getElementById('toast-text');
      const actionBtn = document.getElementById('toast-action');
      if (!el || !iconEl || !textEl || !actionBtn) return;

      const icons = {
        success: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="9 12 11.5 14.5 15.5 9.5"></polyline></svg>',
        info: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>',
        warn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'
      };

      iconEl.innerHTML = icons[tone] || icons.success;
      textEl.textContent = message;

      if (actionLabel) {
        lastToastActionMsg = actionTarget;
        actionBtn.textContent = actionLabel;
        actionBtn.classList.remove('hidden');
      } else {
        actionBtn.classList.add('hidden');
      }

      el.setAttribute('data-open', 'true');
      announce(message);
      scheduleToastHide(2800);
    }

    function toggleSidebar() {
      sidebarCollapsed = !sidebarCollapsed;
      const sidebar = document.getElementById('shell-sidebar');
      const main = document.getElementById('main-canvas');
      const btn = document.getElementById('btn-toggle-sidebar');

      sidebar.classList.toggle('hidden', sidebarCollapsed);
      main.classList.toggle('ml-2', sidebarCollapsed);
      btn.setAttribute('aria-pressed', String(sidebarCollapsed));
      announce(sidebarCollapsed ? '已收起侧边栏' : '已展开侧边栏');
    }

    function toggleExtraDevices() {
      showExtra = !showExtra;
      focusedSerial = null;
      document.getElementById('btn-extra-devices').setAttribute('aria-pressed', String(showExtra));
      renderAll();
      announce(showExtra ? '已展开 4 台多机混排预览' : '已切换回 2 台设备预览');
    }

    function setQuality(q) {
      currentQuality = q;
      const map = { '540p': 'q-540', '720p': 'q-720', '1080p': 'q-1080' };
      Object.entries(map).forEach(([k, id]) => {
        document.getElementById(id).setAttribute('aria-pressed', String(k === q));
      });
      const fps = q === '1080p' ? 60 : q === '540p' ? 20 : 30;
      getActiveDevices().forEach(d => {
        if (d.status === 'mirroring') d.fps = fps;
      });
      renderGrid();
      announce(`画质已切换为 ${q}`);
    }

    function setGridCols(cols) {
      focusedSerial = null;
      gridCols = cols;
      [2, 3, 4].forEach(c => {
        document.getElementById('col-' + c).setAttribute('aria-pressed', String(c === cols));
      });
      renderGrid();
      announce(`网格已切换为 ${cols} 列`);
    }

    function updateAllButtonState() {
      const devs = getActiveDevices();
      const anyMirroring = devs.some(d => d.status === 'mirroring');
      document.getElementById('icon-all-pause').classList.toggle('hidden', !anyMirroring);
      document.getElementById('icon-all-play').classList.toggle('hidden', anyMirroring);
      document.getElementById('label-all-mirror').textContent = anyMirroring ? '暂停全部投屏' : '一键全部投屏';
    }

    function toggleAllMirrors() {
      const devs = getActiveDevices();
      const anyMirroring = devs.some(d => d.status === 'mirroring');
      const target = anyMirroring ? 'ready' : 'mirroring';
      const fps = currentQuality === '1080p' ? 60 : currentQuality === '540p' ? 20 : 30;
      devs.forEach(d => {
        d.status = target;
        d.fps = target === 'mirroring' ? fps : 0;
      });
      renderAll();
      announce(anyMirroring ? '已暂停全部投屏' : '已开始全部投屏');
    }

    function toggleDeviceMirror(serial, e) {
      if (e) e.stopPropagation();
      const d = getActiveDevices().find(item => item.serial === serial);
      if (!d) return;
      d.status = d.status === 'mirroring' ? 'ready' : 'mirroring';
      d.fps = d.status === 'mirroring' ? (currentQuality === '1080p' ? 60 : currentQuality === '540p' ? 20 : 30) : 0;
      renderAll();
    }

    function toggleFocus(serial) {
      focusedSerial = focusedSerial === serial ? null : serial;
      renderGrid();
    }

    function toggleRotate(serial) {
      const d = getActiveDevices().find(item => item.serial === serial);
      if (!d || d.status !== 'mirroring') return;
      const prevW = d.width;
      d.width = d.height;
      d.height = prevW;
      renderAll();
      announce(`${d.name} 已旋转为 ${d.width}×${d.height}`);
    }

    function togglePower(serial) {
      const d = getActiveDevices().find(item => item.serial === serial);
      if (!d || d.status !== 'mirroring') return;
      d.screenOff = !d.screenOff;
      drawAllCanvases();
    }

    function captureShot(serial) {
      const d = getActiveDevices().find(item => item.serial === serial);
      if (!d || d.status !== 'mirroring') return;
      d.flash = true;
      drawAllCanvases();
      setTimeout(() => {
        d.flash = false;
        drawAllCanvases();
      }, 160);
      const safeName = d.name.replace(/\s+/g, '_');
      const shotPath = `~/Pictures/DroidWall/${safeName}_16-28.png`;
      showToast(`已保存截图 · ${shotPath}`, {
        tone: 'success',
        actionLabel: '在 Finder 中显示',
        actionTarget: shotPath
      });
    }

    function renderSidebar() {
      const devs = getActiveDevices();
      document.getElementById('device-count').textContent = String(devs.length);
      const container = document.getElementById('sidebar-devices');

      container.innerHTML = devs.map(d => {
        const isMirroring = d.status === 'mirroring';
        const isFocused = focusedSerial === d.serial;
        const activeClass = isFocused ? 'bg-[var(--tint-active)] border border-[var(--action-pill-border)]' : 'border border-transparent';

        return `
          <div role="button"
               tabindex="0"
               onclick="onSidebarItemClick('${d.serial}')"
               onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();onSidebarItemClick('${d.serial}');}"
               class="sidebar-row rounded-[9px] px-2.5 py-2 cursor-pointer ${activeClass}">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-2 h-2 rounded-full shrink-0 ${isMirroring ? 'bg-[var(--accent-green)]' : 'bg-[var(--text-tertiary)]'}"></span>
                <span class="text-[12.5px] font-medium truncate text-[var(--text-primary)]">${d.name}</span>
              </div>
              <span class="text-[10.5px] font-medium shrink-0 ${isMirroring ? 'text-[var(--accent-green)]' : 'text-[var(--text-tertiary)]'}">
                ${isMirroring ? '投屏中' : '就绪'}
              </span>
            </div>
            <div class="flex items-center justify-between mt-1 pl-4 text-[11px] text-[var(--text-tertiary)]">
              <span class="mono-num">${d.width}×${d.height}</span>
              <span>${d.os}</span>
            </div>
          </div>
        `;
      }).join('');
      updateAllButtonState();
    }

    function onSidebarItemClick(serial) {
      const d = getActiveDevices().find(item => item.serial === serial);
      if (!d) return;
      if (d.status !== 'mirroring') {
        toggleDeviceMirror(serial);
      } else {
        toggleFocus(serial);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('device-grid');
      const devs = getActiveDevices();
      const visible = focusedSerial ? devs.filter(d => d.serial === focusedSerial) : devs;

      grid.className = `grid grid-flow-dense gap-4 items-start ${
        focusedSerial
          ? 'grid-cols-1 max-w-5xl mx-auto w-full'
          : gridCols === 2
          ? 'grid-cols-1 sm:grid-cols-2 max-w-5xl mx-auto w-full'
          : gridCols === 3
          ? 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 w-full'
          : 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 w-full'
      }`;

      grid.innerHTML = visible.map(d => {
        const isMirroring = d.status === 'mirroring';
        const isFocused = focusedSerial === d.serial;
        const ratio = Number((d.width / d.height).toFixed(4));
        const isLandscape = ratio > 1.15;

        const maxW = isFocused
          ? `min(100%, max(260px, calc((100vh - 180px) * ${ratio} + 12px)))`
          : isLandscape
          ? `min(100%, calc((100vh - 210px) * ${ratio} + 12px))`
          : `min(100%, max(238px, calc((100vh - 210px) * ${ratio} + 12px)))`;

        return `
          <article class="device-card mx-auto w-full overflow-hidden flex flex-col ${!isFocused && isLandscape ? 'sm:col-span-2' : ''}"
                   style="max-width: ${maxW}">
            <!-- 卡片顶栏 -->
            <div class="px-3.5 py-2 flex items-center justify-between gap-2 border-b border-[var(--shell-divider)] bg-[var(--device-bar-bg)]">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-2 h-2 rounded-full shrink-0 ${isMirroring ? 'bg-[var(--accent-green)]' : 'bg-[var(--text-tertiary)]'}"></span>
                <div class="min-w-0">
                  <div class="text-[12.5px] font-semibold truncate text-[var(--text-primary)]">${d.name}</div>
                  <div class="mono-num text-[10.5px] text-[var(--text-tertiary)] truncate">${d.os}</div>
                </div>
              </div>

              <div class="flex items-center gap-0.5 shrink-0">
                ${isMirroring ? `<span class="mono-num text-[10.5px] text-[var(--text-tertiary)] mr-1">${d.fps}fps</span>` : ''}
                <button type="button"
                        onclick="toggleDeviceMirror('${d.serial}', event)"
                        aria-label="${isMirroring ? '停止投屏' : '开始投屏'}"
                        title="${isMirroring ? '停止投屏' : '开始投屏'}"
                        class="nav-btn w-7 h-7 rounded-full flex items-center justify-center text-[var(--text-secondary)] cursor-pointer">
                  ${isMirroring
                    ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>`
                    : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>`
                  }
                </button>
                <button type="button"
                        onclick="toggleFocus('${d.serial}')"
                        aria-label="${isFocused ? '退出专注模式' : '专注放大'}"
                        title="${isFocused ? '退出专注模式' : '专注放大'}"
                        class="nav-btn w-7 h-7 rounded-full flex items-center justify-center text-[var(--text-secondary)] cursor-pointer">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    ${isFocused
                      ? `<polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line>`
                      : `<polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line>`
                    }
                  </svg>
                </button>
              </div>
            </div>

            <!-- 屏幕区域：画面严丝合缝铺满（左右零空白） -->
            <div class="relative p-1.5 bg-[var(--device-well)] overscroll-contain">
              <div class="relative w-full overflow-hidden rounded-[14px] bg-black" style="aspect-ratio: ${d.width} / ${d.height}">
                <canvas id="canvas-${d.serial}"
                        width="${d.width}"
                        height="${d.height}"
                        class="device-screen-canvas w-full h-full block cursor-pointer touch-none"
                        onpointerdown="onCanvasPointerDown(event, '${d.serial}')"
                        onpointermove="onCanvasPointerMove(event, '${d.serial}')"
                        onpointerup="onCanvasPointerUp()"
                        onpointercancel="onCanvasPointerUp()"></canvas>

                ${!isMirroring ? `
                  <div class="absolute inset-0 flex flex-col items-center justify-center p-4 bg-black/55 backdrop-blur-sm gap-2.5">
                    <div class="text-[12px] font-medium text-white">真机已就绪</div>
                    <button type="button"
                            onclick="toggleDeviceMirror('${d.serial}', event)"
                            class="px-3.5 py-1.5 rounded-full bg-[var(--accent-blue)] text-white text-[12px] font-medium hover:brightness-110 cursor-pointer inline-flex items-center gap-1.5">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
                      <span>开始投屏</span>
                    </button>
                  </div>
                ` : ''}
              </div>
            </div>

            <!-- 卡片底部控制条 -->
            <div class="px-2.5 py-1.5 flex items-center justify-between border-t border-[var(--shell-divider)] bg-[var(--device-bar-bg)] text-[var(--text-secondary)]">
              <div class="flex items-center gap-0.5">
                <button type="button" onclick="onNavClick('${d.serial}', 'BACK')" aria-label="返回" title="返回" class="nav-btn w-7 h-7 rounded-full flex items-center justify-center cursor-pointer">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button type="button" onclick="onNavClick('${d.serial}', 'HOME')" aria-label="桌面" title="桌面" class="nav-btn w-7 h-7 rounded-full flex items-center justify-center cursor-pointer">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle></svg>
                </button>
                <button type="button" onclick="onNavClick('${d.serial}', 'APP_SWITCH')" aria-label="多任务" title="多任务" class="nav-btn w-7 h-7 rounded-full flex items-center justify-center cursor-pointer">
                  <svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"></rect></svg>
                </button>
              </div>
              <div class="flex items-center gap-0.5">
                <button type="button" onclick="toggleRotate('${d.serial}')" aria-label="旋转" title="旋转屏幕（测试横竖屏自适应）" class="nav-btn w-7 h-7 rounded-full flex items-center justify-center cursor-pointer">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v6h-6"></path><path d="M20 13a8 8 0 1 0-2.34 5.66"></path></svg>
                </button>
                <button type="button" onclick="togglePower('${d.serial}')" aria-label="息屏" title="息屏/亮屏" class="nav-btn w-7 h-7 rounded-full flex items-center justify-center cursor-pointer">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
                </button>
                <button type="button" onclick="captureShot('${d.serial}')" aria-label="截图" title="截图" class="nav-btn w-7 h-7 rounded-full flex items-center justify-center cursor-pointer">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');

      attachWheelGuards();
      drawAllCanvases();
    }

    // 镜像区域内原生 { passive: false } 阻断 wheel，避免触摸板双指与鼠标滚轮引起滑动冲突
    function attachWheelGuards() {
      getActiveDevices().forEach(d => {
        const canvas = document.getElementById('canvas-' + d.serial);
        if (!canvas) return;
        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          e.stopPropagation();
        }, { passive: false });
      });
    }

    function drawAllCanvases() {
      getActiveDevices().forEach(d => {
        const canvas = document.getElementById('canvas-' + d.serial);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const landscape = W > H;

        ctx.clearRect(0, 0, W, H);

        if (d.screenOff) {
          ctx.fillStyle = '#050608';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = 'rgba(255,255,255,0.28)';
          ctx.font = `300 ${Math.round(Math.min(W, H) * 0.11)}px -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText('16:25', W / 2, H / 2);
          return;
        }

        // 现代壁纸渐变
        const grad = ctx.createLinearGradient(0, 0, W, H);
        if (d.page === 0) {
          grad.addColorStop(0, '#10294e');
          grad.addColorStop(0.55, '#1d5b9e');
          grad.addColorStop(1, '#10223b');
        } else {
          grad.addColorStop(0, '#f4f6f9');
          grad.addColorStop(1, '#e8edf4');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        const isLightPage = d.page !== 0;

        // 顶部状态栏
        ctx.fillStyle = isLightPage ? 'rgba(15,23,42,0.78)' : 'rgba(255,255,255,0.88)';
        ctx.font = `600 ${Math.round(Math.min(W, H) * 0.036)}px -apple-system, sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText('16:25', 24, 34);
        ctx.textAlign = 'right';
        ctx.fillText('Wi-Fi · 98%', W - 24, 34);

        if (d.page === 0) {
          // 桌面图标布局（自适应横屏平板 vs 竖屏手机）
          const cols = landscape ? 6 : 4;
          const rows = landscape ? 2 : 3;
          const padX = landscape ? W * 0.12 : W * 0.08;
          const padY = landscape ? H * 0.17 : H * 0.14;
          const usableW = W - padX * 2;
          const usableH = H * 0.60;
          const iconSize = Math.round(Math.min(usableW / cols, usableH / rows) * 0.56);
          const palette = ['#0a84ff', '#30d158', '#ff9f0a', '#5e5ce6', '#ff375f', '#32ade6'];

          let idx = 0;
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const cx = padX + (c + 0.5) * (usableW / cols);
              const cy = padY + (r + 0.5) * (usableH / rows);
              ctx.fillStyle = palette[idx % palette.length];
              ctx.beginPath();
              ctx.roundRect(cx - iconSize / 2, cy - iconSize / 2, iconSize, iconSize, iconSize * 0.24);
              ctx.fill();
              idx++;
            }
          }

          // 底部 Dock 栏
          const dockW = landscape ? W * 0.52 : W * 0.84;
          const dockH = Math.round(iconSize * 1.15);
          const dockX = (W - dockW) / 2;
          const dockY = H - dockH - 28;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.beginPath();
          ctx.roundRect(dockX, dockY, dockW, dockH, dockH * 0.34);
          ctx.fill();

          const dockIcons = 5;
          const dIconSize = Math.round(dockH * 0.64);
          for (let i = 0; i < dockIcons; i++) {
            const dx = dockX + ((i + 0.5) * dockW) / dockIcons;
            const dy = dockY + dockH / 2;
            ctx.fillStyle = palette[(i + 2) % palette.length];
            ctx.beginPath();
            ctx.roundRect(dx - dIconSize / 2, dy - dIconSize / 2, dIconSize, dIconSize, dIconSize * 0.25);
            ctx.fill();
          }
        } else {
          // 列表页（仿真实测应用页面）
          ctx.fillStyle = '#0f172a';
          ctx.font = `700 ${Math.round(Math.min(W, H) * 0.05)}px -apple-system, sans-serif`;
          ctx.textAlign = 'left';
          ctx.fillText(d.page === 1 ? '门店巡检概览' : '系统设置与调试', 28, 86);

          const cardCount = landscape ? 3 : 5;
          for (let i = 0; i < cardCount; i++) {
            const cy = 115 + i * ((H - 175) / cardCount);
            const ch = (H - 175) / cardCount - 14;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(24, cy, W - 48, ch, 16);
            ctx.fill();

            ctx.fillStyle = '#1e293b';
            ctx.font = `600 ${Math.round(Math.min(W, H) * 0.036)}px -apple-system, sans-serif`;
            ctx.fillText(`业务模块 #${i + 1} · ${d.name}`, 44, cy + ch * 0.45);
            ctx.fillStyle = '#64748b';
            ctx.font = `${Math.round(Math.min(W, H) * 0.028)}px monospace`;
            ctx.fillText(`分辨率 ${W}×${H} · 点击坐标 1:1 对齐`, 44, cy + ch * 0.76);
          }
        }

        // 触控波纹
        d.ripples.forEach(r => {
          const rx = r.xRatio * W;
          const ry = r.yRatio * H;
          ctx.save();
          ctx.beginPath();
          ctx.arc(rx, ry, r.radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(10, 132, 255, 0.34)';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#0a84ff';
          ctx.stroke();
          ctx.restore();
        });

        if (d.flash) {
          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.fillRect(0, 0, W, H);
        }
      });
    }

    function getCanvasRatio(e, canvas) {
      const rect = canvas.getBoundingClientRect();
      return {
        xRatio: Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)),
        yRatio: Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height))
      };
    }

    function onCanvasPointerDown(e, serial) {
      const d = getActiveDevices().find(item => item.serial === serial);
      if (!d || d.status !== 'mirroring') return;
      isPointerDown = true;
      activeSerial = serial;
      e.currentTarget.setPointerCapture(e.pointerId);
      if (d.screenOff) {
        d.screenOff = false;
        drawAllCanvases();
        return;
      }
      const { xRatio, yRatio } = getCanvasRatio(e, e.currentTarget);
      d.ripples.push({ xRatio, yRatio, radius: Math.max(18, Math.min(d.width, d.height) * 0.05) });
      d.page = (d.page + 1) % 3;
      drawAllCanvases();
      setTimeout(() => {
        d.ripples.shift();
        drawAllCanvases();
      }, 320);
    }

    function onCanvasPointerMove(e, serial) {
      if (!isPointerDown || activeSerial !== serial) return;
      const now = Date.now();
      if (now - lastTrailTime < 35) return;
      lastTrailTime = now;
      const d = getActiveDevices().find(item => item.serial === serial);
      if (!d || d.status !== 'mirroring') return;
      const { xRatio, yRatio } = getCanvasRatio(e, e.currentTarget);
      d.ripples.push({ xRatio, yRatio, radius: Math.max(12, Math.min(d.width, d.height) * 0.03) });
      if (d.ripples.length > 5) d.ripples.shift();
      drawAllCanvases();
      setTimeout(() => {
        d.ripples.shift();
        drawAllCanvases();
      }, 280);
    }

    function onCanvasPointerUp() {
      isPointerDown = false;
      activeSerial = null;
    }

    function onNavClick(serial, key) {
      const d = getActiveDevices().find(item => item.serial === serial);
      if (!d || d.status !== 'mirroring') return;
      if (key === 'HOME') d.page = 0;
      else if (key === 'BACK') d.page = Math.max(0, d.page - 1);
      else if (key === 'APP_SWITCH') d.page = (d.page + 1) % 3;
      drawAllCanvases();
    }

    function setupToolbarFallback() {
      if ('focusGroup' in HTMLElement.prototype) return;
      const bar = document.querySelector('[role="toolbar"]');
      if (!bar) return;
      const getItems = () => Array.from(bar.querySelectorAll('button')).filter(b => b.offsetParent !== null);
      const syncTabIndex = (activeEl) => {
        const items = getItems();
        items.forEach((b, i) => {
          b.tabIndex = activeEl ? (b === activeEl ? 0 : -1) : (i === 0 ? 0 : -1);
        });
      };
      syncTabIndex(null);
      bar.addEventListener('focusin', (e) => {
        if (e.target.tagName === 'BUTTON') syncTabIndex(e.target);
      });
      bar.addEventListener('keydown', (e) => {
        const items = getItems();
        const idx = items.indexOf(document.activeElement);
        if (idx === -1) return;
        const rtl = getComputedStyle(bar).direction === 'rtl';
        let next = null;
        if (e.key === 'ArrowRight') next = (idx + (rtl ? -1 : 1) + items.length) % items.length;
        else if (e.key === 'ArrowLeft') next = (idx + (rtl ? 1 : -1) + items.length) % items.length;
        else if (e.key === 'Home') next = 0;
        else if (e.key === 'End') next = items.length - 1;
        if (next !== null) {
          e.preventDefault();
          items[next].focus();
        }
      });
    }

    function renderAll() {
      renderSidebar();
      renderGrid();
    }

    updateThemeToggleIcon();
    setupToolbarFallback();
    renderAll();
  </script>
</body>
</html>
